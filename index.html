<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever ❤️ | Vanshika</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div id="stars"></div>
<div id="hearts"></div>

<audio id="bgMusic" loop>
    <source src="Saiyaara Dhun - Bgm _ Instrumental.mp3" type="audio/mpeg">
</audio>

<section class="hero">

    <h2>❤️ My Forever ❤️</h2>

    <h1>Vanshika</h1>

    <p>
        Every heartbeat whispers your name...
        Every dream starts with you...
    </p>

    <button id="startBtn">
        Enter Our Love Story ❤️
    </button>

</section>

<section class="gallery">

<h2>Our Beautiful Memories 📸</h2>

<div class="slideshow">

<img src="photo1.jpg" class="slide active">
<img src="photo2.jpg" class="slide">
<img src="photo3.jpg" class="slide">
<img src="photo4.png" class="slide">

</div>

</section>

<section class="proposal">

<h2>

Will You Stay With Me Forever?

</h2>

<div class="btnBox">

<button id="yesBtn">

Yes ❤️

</button>

<button id="noBtn">

No 💔

</button>

</div>

</section>
<section class="letter">

<div class="glass">

<h2>💌 A Letter For You 💌</h2>

<p id="typeText"></p>

</div>

</section>

<section class="ending">

<h1>Forever Starts Here ❤️</h1>

<p>
No matter where life takes us...
I will always choose you,
again and again...
Forever.
</p>

</section>

<script src="script.js"></script>

</body>
</html>
